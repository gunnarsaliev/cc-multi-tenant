# Optional local Postgres with pgvector. Matches the POSTGRES_URL in .env.example
# once a user is added: postgres://postgres:postgres@127.0.0.1:5432/payload-example-multi-tenant
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: payload-example-multi-tenant
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
